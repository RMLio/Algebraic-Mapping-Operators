stages:
  - build
  - unittests
  - deploy

variables:
  # This will suppress any download for dependencies and plugins or upload messages which would clutter the console log.
  # `showDateTime` will show the passed time in milliseconds.
  MAVEN_OPTS: "-Dhttps.protocols=TLSv1.2 -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN -Dorg.slf4j.simpleLogger.showDateTime=true -Djava.awt.headless=true"
  MAVEN_CLI_OPTS: " --batch-mode --errors --fail-at-end --show-version -DinstallAtEnd=true -DdeployAtEnd=true"
  # replace above with below when ready for release
#  MAVEN_CLI_OPTS: "-s $CI_PROJECT_DIR/.m2/settings.xml --batch-mode --errors --fail-at-end --show-version -DinstallAtEnd=true -DdeployAtEnd=true"


cache:
  key: ${CI_JOB_NAME}
  paths:
    - .m2/repository

# Cancel pipeline if a newer pipeline is running
default:
  interruptible: true

###############################
#                             #
#     Unittests               #
#                             #
###############################

Tests:
  stage: unittests
  image: maven:3-eclipse-temurin-21
  retry: 2
  before_script:
    - 'mvn clean'
  script:
    - 'mvn $MAVEN_CLI_OPTS -Dtest="$TEST" test'
  parallel:
    matrix:
      - TEST: [
        # blocks
        SolutionMappingTests, BGPTest,
        # binary operators
        LeftJoinTest, NaturalJoinTest, ThetaJoinTest,
        # unary operators
        ExtendTest, FragmentTest, ProjectTest, RenameTest,
        # general operators
        DataIOSourceOperatorTest, SerializeOperatorTest, TargetOperatorTest

      ]
  except:
    - main
    - development
